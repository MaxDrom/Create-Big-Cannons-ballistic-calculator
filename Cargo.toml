[workspace]
members = ["bal_core"]
resolver = "2"


[profile.release.package.bal_core]
rustflags = ["-Zautodiff=Enable"]

[package]
name = "bal_rust"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dependencies]
nalgebra = "0.35.0"
bal_core = {path = "./bal_core"}
axum = "0.8.9"
serde = {version = "1.0.229",  features = ["derive"] }
tokio = {version = "1.54.1", features = ["full"]}
serde-aux = "4.7.0"
thiserror = "2.0.21"
clap = {version = "4.6.4", features = ["derive"]}
